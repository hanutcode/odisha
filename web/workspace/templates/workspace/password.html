{% extends "workspace/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="head"><div><h1>Change password</h1><p class="muted">At least 10 characters, not a common password.</p></div></div>
<div class="card" style="max-width:460px">
  <form method="post" class="stack">
    {% csrf_token %}
    {% for field in form %}
      <label class="f" for="{{ field.id_for_label }}">{{ field.label }}
        <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required>
        {% for e in field.errors %}<span style="color:var(--bad)">{{ e }}</span>{% endfor %}
      </label>
    {% endfor %}
    <button class="btn primary" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
